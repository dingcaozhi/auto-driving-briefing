name: Daily Auto Driving Briefing Update

on:
  schedule:
    # 每天早上 9:00 UTC+8 (1:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Fetch news
        run: python fetch_news.py
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update briefing $(date +'%Y-%m-%d')"
          git push
